<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ELPI Certificate Monitor</title>
  <meta name="description" content="Monitoring sertifikat kapal ELPI">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ELPI Cert">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <style>
    html, body { margin: 0; height: 100%; background: #F3F6FC; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #0F1B33; }
    body { overflow: hidden; }
    #app { position: fixed; top: env(safe-area-inset-top); left: env(safe-area-inset-left); border: 0; display: block; background: #F3F6FC;
      width: calc(100% - env(safe-area-inset-left) - env(safe-area-inset-right)); height: calc(100% - env(safe-area-inset-top) - env(safe-area-inset-bottom)); }
    #splash { position: fixed; inset: 0; z-index: 2; display: grid; place-content: center; justify-items: center; gap: 22px; background: #fff; transition: opacity .35s ease; }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash img { width: 150px; height: auto; }
    .bar { width: 120px; height: 3px; border-radius: 3px; background: #E3E9F4; overflow: hidden; position: relative; }
    .bar::after { content: ''; position: absolute; inset: 0; width: 40%; background: #2B67F6; border-radius: 3px; animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    #splash small { color: #5B6B86; font-size: 13px; }
    #offline { position: fixed; inset: 0; z-index: 3; display: none; place-content: center; justify-items: center; gap: 10px; padding: 24px; text-align: center; background: #fff; }
    #offline.on { display: grid; }
    #offline b { font-size: 17px; }
    #offline span { color: #5B6B86; font-size: 14px; max-width: 300px; line-height: 1.5; }
    #offline button { margin-top: 8px; height: 42px; padding: 0 22px; border: 0; border-radius: 12px; background: #2B67F6; color: #fff; font: inherit; font-weight: 600; font-size: 14px; }
    @media (prefers-reduced-motion: reduce) { .bar::after { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/logo.png" alt="ELPI">
    <div class="bar"></div>
    <small>Memuat Certificate Monitor</small>
  </div>
  <div id="offline">
    <b>Tidak ada koneksi internet</b>
    <span>Certificate Monitor membutuhkan internet untuk mengambil data terbaru dari spreadsheet.</span>
    <button type="button" onclick="location.reload()">Coba lagi</button>
  </div>

  <script>
    // ====================================================================================
    // Link web app Apps Script (URL yang berakhiran /exec). Ganti bila deployment berubah.
    var APP_URL = 'https://script.google.com/macros/s/AKfycbxg3rGuskVGtuqkV_CLZEc2nQ9zJgOJQKFpUSO-JWlmyZE-ELEPWaq4jWeBsccbKcO3QQ/exec';
    // ====================================================================================

    var splash = document.getElementById('splash'), offline = document.getElementById('offline');
    function hideSplash() { splash.classList.add('hide'); }
    function start() {
      if (!navigator.onLine) { offline.classList.add('on'); hideSplash(); return; }
      offline.classList.remove('on');
      // Buka langsung (bukan iframe): iframe gagal bila HP login ke beberapa akun Google.
      setTimeout(function () { location.replace(APP_URL); }, 500);
    }
    window.addEventListener('offline', function () { offline.classList.add('on'); });
    window.addEventListener('online', function () { if (offline.classList.contains('on')) location.reload(); });
    start();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { }); });
    }
  </script>
</body>
</html>
