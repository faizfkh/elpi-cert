<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ELPI Certificate Monitor</title>
  <meta name="description" content="Monitoring sertifikat kapal ELPI">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ELPI Cert">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <style>
    html, body { margin: 0; min-height: 100%; background: #F3F6FC; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #0F1B33; }
    body { display: grid; place-items: center; padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom)); min-height: 100vh; box-sizing: border-box; }
    .card { width: 100%; max-width: 380px; background: #fff; border: 1px solid #E3E9F4; border-radius: 20px; padding: 28px 22px 22px; text-align: center; box-shadow: 0 8px 30px rgba(43,103,246,.08); }
    .card img { width: 150px; height: auto; }
    h1 { font-size: 19px; margin: 16px 0 6px; }
    p { margin: 0; color: #5B6B86; font-size: 14px; line-height: 1.5; }
    .btn { display: block; width: 100%; height: 48px; margin-top: 12px; border: 0; border-radius: 12px; font: inherit; font-weight: 600; font-size: 15px; cursor: pointer; transition: transform .12s ease, filter .12s ease; }
    .btn:active { transform: scale(.98); }
    .primary { background: #2B67F6; color: #fff; }
    .ghost { background: #EAF1FF; color: #1E4FD0; }
    #install { display: none; margin-top: 22px; }
    #howto { display: none; margin-top: 12px; padding: 12px 14px; background: #F3F6FC; border-radius: 12px; text-align: left; font-size: 13.5px; line-height: 1.55; color: #33425F; }
    #howto b { color: #0F1B33; }
    #off { display: none; margin-top: 14px; color: #B42318; font-size: 13px; }
    #go { display: none; position: fixed; inset: 0; background: #fff; place-content: center; justify-items: center; gap: 18px; }
    #go.on { display: grid; }
    #go img { width: 140px; }
    .bar { width: 120px; height: 3px; border-radius: 3px; background: #E3E9F4; overflow: hidden; position: relative; }
    .bar::after { content: ''; position: absolute; inset: 0; width: 40%; background: #2B67F6; border-radius: 3px; animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { .bar::after { animation: none; width: 100%; } .btn { transition: none; } }
  </style>
</head>
<body>
  <div class="card" id="home">
    <img src="icons/logo.png" alt="ELPI">
    <h1>Certificate Monitor</h1>
    <p>Pantau masa berlaku sertifikat kapal ELPI.</p>
    <button class="btn primary" id="open" type="button">Buka aplikasi</button>
    <button class="btn ghost" id="install" type="button">Pasang di HP</button>
    <div id="howto"></div>
    <div id="off">Tidak ada koneksi internet.</div>
  </div>
  <div id="go"><img src="icons/logo.png" alt="ELPI"><div class="bar"></div></div>

  <script>
    // Link web app Apps Script (berakhiran /exec). Ganti bila deployment berubah.
    var APP_URL = 'https://script.google.com/macros/s/AKfycbxg3rGuskVGtuqkV_CLZEc2nQ9zJgOJQKFpUSO-JWlmyZE-ELEPWaq4jWeBsccbKcO3QQ/exec';

    var $ = function (id) { return document.getElementById(id); };
    var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
    var ua = navigator.userAgent || '';
    var isIOS = /iphone|ipad|ipod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    var deferred = null;

    function openApp() {
      if (!navigator.onLine) { $('off').style.display = 'block'; return; }
      $('go').classList.add('on');
      location.replace(APP_URL);
    }
    $('open').addEventListener('click', openApp);

    // Dibuka dari ikon layar utama -> langsung masuk aplikasi.
    if (standalone) { openApp(); }

    // Android / Chrome: tombol pasang muncul otomatis begitu browser mengizinkan.
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault(); deferred = e;
      $('install').style.display = 'block';
    });
    $('install').addEventListener('click', function () {
      if (deferred) {
        deferred.prompt();
        deferred.userChoice.then(function () { deferred = null; $('install').style.display = 'none'; });
      } else { showHowto(); }
    });
    window.addEventListener('appinstalled', function () {
      $('install').style.display = 'none'; $('howto').style.display = 'none';
    });

    function showHowto() {
      var h = $('howto');
      h.innerHTML = isIOS
        ? '<b>Cara pasang di iPhone</b><br>1. Buka halaman ini di <b>Safari</b>.<br>2. Ketuk ikon <b>Bagikan</b> (kotak dengan panah ke atas).<br>3. Pilih <b>Tambah ke Layar Utama</b>, lalu <b>Tambah</b>.'
        : '<b>Cara pasang</b><br>Ketuk menu <b>&#8942;</b> di pojok kanan atas Chrome, lalu pilih <b>Instal aplikasi</b> atau <b>Tambahkan ke layar utama</b>.';
      h.style.display = 'block';
    }
    // iPhone tidak punya tombol pasang otomatis: tampilkan tombol yang membuka petunjuk.
    if (isIOS && !standalone) { $('install').style.display = 'block'; }
    // Browser lain yang belum memicu tombol otomatis: tetap beri jalan.
    setTimeout(function () { if (!standalone && !deferred && !isIOS) { $('install').style.display = 'block'; } }, 2500);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { }); });
    }
  </script>
</body>
</html>
